# Publishes the research site (web/) to GitHub Pages. Runs only when started by hand (Actions tab, "Run
# workflow"), so nothing is published by a push. Needs Pages enabled with "GitHub Actions" as the source.
# The live brain-likeness test needs its server (web/serve.sh); on Pages, /test/ is its static reference page.
name: Publish site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
