# Publishes the research site (web/) to GitHub Pages. Runs on every push to main that changes web/ or this
# file, and can also be started by hand (Actions tab, "Run workflow"). So whatever is pushed to main under
# web/ goes live within a minute or two: keep unfinished site work on another branch.
# Needs Pages enabled with "GitHub Actions" as the source.
# The site's address is https://nematica.weptune.dev: set it as the custom domain under Settings, Pages.
# The live brain-likeness test needs its server (web/serve.sh); on Pages, /test/ is its static reference page.
name: Publish site
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # The deploy step sometimes cannot see the artifact uploaded a moment earlier and fails with
      # "No artifacts named github-pages were found" (seen on 21 Nov 2026 with both v4 and v5, in runs whose
      # upload step had succeeded). GitHub's own message says to try again later, so wait and try once more.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
