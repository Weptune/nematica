[project]
name = "nematica"
version = "0.1.0"
description = "A fidelity benchmark and virtual organism for C. elegans whole-brain models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
connectome = ["cect>=0.3"]
gru = ["torch>=2.0"]
# PyTorch is installed separately from the CUDA selector at
# https://docs.pytorch.org/get-started/locally/ so the right CUDA build is used.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nematica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
